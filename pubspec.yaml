name: virtual_keypad
description: "On-screen virtual keyboard widget and keypad for Flutter kiosk, POS, TV, desktop and touchscreen apps. Numeric, numpad, PIN, emoji, floating and custom layouts in 12 languages."
version: 1.6.0
homepage: https://github.com/almasumdev/virtual_keypad
repository: https://github.com/almasumdev/virtual_keypad
issue_tracker: https://github.com/almasumdev/virtual_keypad/issues
documentation: https://virtual-keypad-docs.web.app

topics:
  - keyboard
  - virtual-keyboard
  - onscreen-keyboard
  - multilingual-keyboard
  - text-input

screenshots:
  - description: "The virtual_keypad logo."
    path: images/logo.png
  - description: "Six keyboards side by side: wide email layout, color emoji page, dark PIN pad, QWERTY, Arabic right to left, and a themed numeric kiosk pad."
    path: previews/showcase-devices.png
  - description: "Six of the 12 built-in languages: Bengali, Hindi, Russian, Korean, Thai, and French AZERTY."
    path: previews/showcase-languages.png

environment:
  sdk: ^3.0.0
  flutter: ">=3.3.0"

dependencies:
  emoji_picker_flutter: ^4.4.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Noto Emoji, subset to the 1271 codepoints the emoji picker uses.
  # Flutter web downloads a fallback emoji font on demand, so without a bundled
  # font the emoji page renders blank on a first offline load. This font is only
  # applied on web; native platforms keep their own color emoji font.
  # Licensed under the SIL Open Font License 1.1, see fonts/OFL.txt.
  fonts:
    - family: NotoEmoji
      fonts:
        - asset: fonts/NotoEmoji-Regular.ttf

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

